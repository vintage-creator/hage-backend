name: Build and Deploy to App Runner

permissions:
  id-token: write
  contents: read
  pull-requests: write

on:
  push:
    branches: [ main, develop, prerelease ]
  pull_request:
    types: [opened, synchronize, closed]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'build'
        type: choice
        options:
          - build
          - deploy
          - rollback
      environment:
        description: 'Environment to target'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
          - both
      image_tag:
        description: 'Custom image tag (for build/deploy) or target image tag (for rollback)'
        required: false
        type: string
      rollback_to_image:
        description: 'Full image URI to rollback to'
        required: false
        type: string

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

jobs:
  determine-strategy:
    name: Determine Build Strategy
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.strategy.outputs.should_build }}
      should_deploy: ${{ steps.strategy.outputs.should_deploy }}
      should_rollback: ${{ steps.strategy.outputs.should_rollback }}
      environment: ${{ steps.strategy.outputs.environment }}
      deploy_to_dev: ${{ steps.strategy.outputs.deploy_to_dev }}
      deploy_to_prod: ${{ steps.strategy.outputs.deploy_to_prod }}
      image_tag: ${{ steps.strategy.outputs.image_tag }}
      rollback_image: ${{ steps.strategy.outputs.rollback_image }}
      branch_name: ${{ steps.strategy.outputs.branch_name }}
      is_pr: ${{ steps.strategy.outputs.is_pr }}
    steps:
      - name: Determine strategy
        id: strategy
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            action="${{ github.event.inputs.action }}"
            environment="${{ github.event.inputs.environment }}"
            image_tag="${{ github.event.inputs.image_tag }}"
            rollback_image="${{ github.event.inputs.rollback_to_image }}"
            
            echo "should_build=$([ "$action" = "build" ] || [ "$action" = "deploy" ] && echo "true" || echo "false")" >> $GITHUB_OUTPUT
            echo "should_deploy=$([ "$action" = "deploy" ] && echo "true" || echo "false")" >> $GITHUB_OUTPUT
            echo "should_rollback=$([ "$action" = "rollback" ] && echo "true" || echo "false")" >> $GITHUB_OUTPUT
            echo "environment=$environment" >> $GITHUB_OUTPUT
            
            if [ "$environment" = "both" ]; then
              echo "deploy_to_dev=true" >> $GITHUB_OUTPUT
              echo "deploy_to_prod=true" >> $GITHUB_OUTPUT
            elif [ "$environment" = "dev" ]; then
              echo "deploy_to_dev=true" >> $GITHUB_OUTPUT
              echo "deploy_to_prod=false" >> $GITHUB_OUTPUT
            elif [ "$environment" = "prod" ]; then
              echo "deploy_to_dev=false" >> $GITHUB_OUTPUT
              echo "deploy_to_prod=true" >> $GITHUB_OUTPUT
            fi
            
            echo "image_tag=$image_tag" >> $GITHUB_OUTPUT
            echo "rollback_image=$rollback_image" >> $GITHUB_OUTPUT
            echo "branch_name=manual" >> $GITHUB_OUTPUT
            echo "is_pr=false" >> $GITHUB_OUTPUT
          else
            branch_name="${{ github.ref_name }}"
            is_pr="${{ github.event_name == 'pull_request' }}"
            
            if [ "$branch_name" = "main" ]; then
              echo "should_build=true" >> $GITHUB_OUTPUT
              echo "should_deploy=true" >> $GITHUB_OUTPUT
              echo "should_rollback=false" >> $GITHUB_OUTPUT
              echo "environment=dev" >> $GITHUB_OUTPUT
              echo "deploy_to_dev=true" >> $GITHUB_OUTPUT
              echo "deploy_to_prod=false" >> $GITHUB_OUTPUT
              echo "image_tag=main-${{ github.sha }}" >> $GITHUB_OUTPUT
            elif [ "$branch_name" = "develop" ]; then
              echo "should_build=true" >> $GITHUB_OUTPUT
              echo "should_deploy=true" >> $GITHUB_OUTPUT
              echo "should_rollback=false" >> $GITHUB_OUTPUT
              echo "environment=dev" >> $GITHUB_OUTPUT
              echo "deploy_to_dev=true" >> $GITHUB_OUTPUT
              echo "deploy_to_prod=false" >> $GITHUB_OUTPUT
              echo "image_tag=develop-${{ github.sha }}" >> $GITHUB_OUTPUT
            elif [ "$branch_name" = "prerelease" ]; then
              echo "should_build=true" >> $GITHUB_OUTPUT
              echo "should_deploy=true" >> $GITHUB_OUTPUT
              echo "should_rollback=false" >> $GITHUB_OUTPUT
              echo "environment=preview" >> $GITHUB_OUTPUT
              echo "deploy_to_dev=true" >> $GITHUB_OUTPUT
              echo "deploy_to_prod=false" >> $GITHUB_OUTPUT
              echo "image_tag=prerelease-${{ github.sha }}" >> $GITHUB_OUTPUT
            else
              echo "should_build=true" >> $GITHUB_OUTPUT
              echo "should_deploy=false" >> $GITHUB_OUTPUT
              echo "should_rollback=false" >> $GITHUB_OUTPUT
              echo "environment=dev" >> $GITHUB_OUTPUT
              echo "deploy_to_dev=false" >> $GITHUB_OUTPUT
              echo "deploy_to_prod=false" >> $GITHUB_OUTPUT
              echo "image_tag=${branch_name//\//-}-${{ github.sha }}" >> $GITHUB_OUTPUT
            fi
            
            echo "rollback_image=" >> $GITHUB_OUTPUT
            echo "branch_name=$branch_name" >> $GITHUB_OUTPUT
            echo "is_pr=$is_pr" >> $GITHUB_OUTPUT
          fi
          
          # Handle scheduled cleanup
          if [ "${{ github.event_name }}" = 'schedule' ]; then
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            echo "should_rollback=false" >> $GITHUB_OUTPUT
            echo "environment=cleanup" >> $GITHUB_OUTPUT
            echo "deploy_to_dev=false" >> $GITHUB_OUTPUT
            echo "deploy_to_prod=false" >> $GITHUB_OUTPUT
            echo "image_tag=" >> $GITHUB_OUTPUT
            echo "rollback_image=" >> $GITHUB_OUTPUT
            echo "branch_name=scheduled" >> $GITHUB_OUTPUT
            echo "is_pr=false" >> $GITHUB_OUTPUT
          fi
          
          # Handle pull requests
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            target_branch="${{ github.base_ref }}"
            pr_number="${{ github.event.number }}"
            pr_action="${{ github.event.action }}"
            
            # Only create services for opened/updated PRs, cleanup for closed PRs
            if [ "$pr_action" = "opened" ] || [ "$pr_action" = "synchronize" ]; then
              echo "should_build=true" >> $GITHUB_OUTPUT
              echo "should_deploy=true" >> $GITHUB_OUTPUT
              echo "should_rollback=false" >> $GITHUB_OUTPUT
              echo "environment=preview" >> $GITHUB_OUTPUT
              echo "deploy_to_dev=true" >> $GITHUB_OUTPUT
              echo "deploy_to_prod=false" >> $GITHUB_OUTPUT
              echo "image_tag=pr-$pr_number-${{ github.sha }}" >> $GITHUB_OUTPUT
              echo "rollback_image=" >> $GITHUB_OUTPUT
              echo "branch_name=pr-$pr_number" >> $GITHUB_OUTPUT
              echo "is_pr=true" >> $GITHUB_OUTPUT
            elif [ "$pr_action" = "closed" ]; then
              echo "should_build=false" >> $GITHUB_OUTPUT
              echo "should_deploy=false" >> $GITHUB_OUTPUT
              echo "should_rollback=false" >> $GITHUB_OUTPUT
              echo "environment=cleanup" >> $GITHUB_OUTPUT
              echo "deploy_to_dev=false" >> $GITHUB_OUTPUT
              echo "deploy_to_prod=false" >> $GITHUB_OUTPUT
              echo "image_tag=" >> $GITHUB_OUTPUT
              echo "rollback_image=" >> $GITHUB_OUTPUT
              echo "branch_name=pr-$pr_number" >> $GITHUB_OUTPUT
              echo "is_pr=true" >> $GITHUB_OUTPUT
            else
              # For other PR actions (labeled, assigned, etc.), just build
              echo "should_build=true" >> $GITHUB_OUTPUT
              echo "should_deploy=false" >> $GITHUB_OUTPUT
              echo "should_rollback=false" >> $GITHUB_OUTPUT
              echo "environment=none" >> $GITHUB_OUTPUT
              echo "deploy_to_dev=false" >> $GITHUB_OUTPUT
              echo "deploy_to_prod=false" >> $GITHUB_OUTPUT
              echo "image_tag=pr-$pr_number-${{ github.sha }}" >> $GITHUB_OUTPUT
              echo "rollback_image=" >> $GITHUB_OUTPUT
              echo "branch_name=pr-$pr_number" >> $GITHUB_OUTPUT
              echo "is_pr=true" >> $GITHUB_OUTPUT
            fi
          fi

  build-image:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: determine-strategy
    if: needs.determine-strategy.outputs.should_build == 'true'
    outputs:
      image_repository: ${{ steps.meta.outputs.tags }}
      image_tag: ${{ steps.meta.outputs.tags }}
      primary_tag: ${{ steps.meta.outputs.primary_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-service-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/hage-mvp-app-${{ env.AWS_ACCOUNT_ID }}
          tags: |
            type=raw,value=${{ needs.determine-strategy.outputs.image_tag }}
            type=raw,value=latest,enable=${{ needs.determine-strategy.outputs.branch_name == 'main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [determine-strategy, build-image]
    if: needs.determine-strategy.outputs.deploy_to_dev == 'true'
    environment: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-service-role
          aws-region: ${{ env.AWS_REGION }}


      - name: Deploy to Development
        run: |
          ENVIRONMENT="dev"
          ENV_TAG="$ENVIRONMENT"
          
          # Set image tag based on different scenarios
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.image_tag }}" ]; then
            IMAGE_TAG="${{ github.event.inputs.image_tag }}"
          elif [ "${{ needs.determine-strategy.outputs.should_build }}" = "true" ]; then
            # Use the strategy image tag if available, otherwise use primary tag from build
            if [ -n "${{ needs.determine-strategy.outputs.image_tag }}" ]; then
              IMAGE_TAG="${{ needs.determine-strategy.outputs.image_tag }}"
            else
              IMAGE_TAG="${{ needs.build-image.outputs.primary_tag }}"
            fi
          else
            # Fallback to strategy image tag
            IMAGE_TAG="${{ needs.determine-strategy.outputs.image_tag }}"
          fi
          
          # Ensure we have a valid image tag
          if [ -z "$IMAGE_TAG" ]; then
            echo "Error: No image tag specified"
            exit 1
          fi
          
          IMAGE_URI="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/hage-mvp-app-${{ env.AWS_ACCOUNT_ID }}:$IMAGE_TAG"
          
          # Determine service name based on branch/PR
          if [ "${{ needs.determine-strategy.outputs.is_pr }}" = "true" ]; then
            SERVICE_NAME="hage-mvp-app-pr-${{ github.event.number }}"
            echo "Creating PR service for PR #${{ github.event.number }}"
          elif [ "${{ needs.determine-strategy.outputs.branch_name }}" = "main" ]; then
            SERVICE_NAME="hage-mvp-app-main"
            echo "Creating main service"
          elif [ "${{ needs.determine-strategy.outputs.branch_name }}" = "prerelease" ]; then
            SERVICE_NAME="hage-mvp-app-prerelease"
            echo "Creating prerelease service"
          else
            SERVICE_NAME="hage-mvp-app-dev"
            echo "Creating dev service"
          fi
          
          echo "Deploying to $ENVIRONMENT environment"
          echo "Service: $SERVICE_NAME"
          echo "Image: $IMAGE_URI"
          
          # Create JSON configuration file to avoid shell escaping issues
          ACCESS_ROLE_ARN="arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/hage-mvp-dev-app-runner-service-role"
          cat > apprunner-config.json << EOF
          {
            "ImageRepository": {
              "ImageIdentifier": "$IMAGE_URI",
              "ImageConfiguration": {
                "Port": "3000",
                "RuntimeEnvironmentVariables": {
                  "NODE_ENV": "$ENVIRONMENT",
                  "JWT_EXPIRES_IN": "15m",
                  "REFRESH_EXPIRES_DAYS": "30",
                  "MAIL_HOST": "${{ vars.MAIL_HOST_DEV }}",
                  "MAIL_PORT": "${{ vars.MAIL_PORT_DEV }}",
                  "MAIL_FROM": "${{ vars.MAIL_FROM_DEV }}",
                  "MAIL_USER": "${{ vars.MAIL_USER_DEV }}",
                  "MAIL_PASS": "${{ vars.MAIL_PASS_DEV }}",
                  "APP_NAME": "Hage Logistics",
                  "APP_URL": "${{ vars.APP_URL_DEV }}",
                  "FRONTEND_URL": "${{ vars.FRONTEND_URL_DEV }}",
                  "API_PREFIX": "/api",
                  "APP_LOGO": "https://res.cloudinary.com/doam8l8j9/image/upload/v1760557572/hage_logo_1_vkocjc.png",
                  "ENABLE_SEEDING": "true"
                },
                "RuntimeEnvironmentSecrets": {
                  "DATABASE_URL": "arn:aws:secretsmanager:eu-west-2:283780611213:secret:hage-mvp/dev/rds/master-xRcVlo:DATABASE_URL::",
                  "JWT_SECRET": "arn:aws:secretsmanager:eu-west-2:283780611213:secret:hage-mvp/dev/jwt-secret-oqoaaG",
                  "CLOUDINARY_CLOUD_NAME": "arn:aws:secretsmanager:eu-west-2:283780611213:secret:hage-mvp/dev/cloudinary-credentials-ESKjAs:cloud_name::",
                  "CLOUDINARY_API_KEY": "arn:aws:secretsmanager:eu-west-2:283780611213:secret:hage-mvp/dev/cloudinary-credentials-ESKjAs:api_key::",
                  "CLOUDINARY_API_SECRET": "arn:aws:secretsmanager:eu-west-2:283780611213:secret:hage-mvp/dev/cloudinary-credentials-ESKjAs:api_secret::"
                }
              },
              "ImageRepositoryType": "ECR"
            },
            "AuthenticationConfiguration": {
              "AccessRoleArn": "$ACCESS_ROLE_ARN"
            },
            "AutoDeploymentsEnabled": false
          }
          EOF
          
          cat > health-check-config.json << EOF
          {
            "Protocol": "HTTP",
            "Path": "/api/health",
            "Interval": 10,
            "Timeout": 5,
            "HealthyThreshold": 2,
            "UnhealthyThreshold": 5
          }
          EOF
          
          cat > instance-config.json << EOF
          {
            "Cpu": "0.25 vCPU",
            "Memory": "0.5 GB",
            "InstanceRoleArn": "arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/hage-mvp-dev-app-runner-instance-role"
          }
          EOF


          cat > network-config.json << EOF
          {
            "EgressConfiguration": {
              "EgressType": "VPC",
              "VpcConnectorArn": "arn:aws:apprunner:${{ env.AWS_REGION }}:${{ env.AWS_ACCOUNT_ID }}:vpcconnector/hage-mvp-main-vpc-connector-v2/1/9b848ff85b954a7380544856e7c5dedd" 
            }
          }
          EOF


          # Check if service exists and create or update accordingly
          SERVICE_ARN="arn:aws:apprunner:${{ env.AWS_REGION }}:${{ env.AWS_ACCOUNT_ID }}:service/$SERVICE_NAME"
          
          if aws apprunner describe-service --service-arn "$SERVICE_ARN" > /dev/null 2>&1; then
            echo "Service exists, updating..."
            aws apprunner update-service \
              --service-arn "$SERVICE_ARN" \
              --source-configuration file://apprunner-config.json \
              --health-check-configuration file://health-check-config.json \
              --instance-configuration file://instance-config.json \
              --network-configuration file://network-config.json
              



          else
            echo "Service does not exist, creating..."
            aws apprunner create-service \
              --service-name "$SERVICE_NAME" \
              --source-configuration file://apprunner-config.json \
              --health-check-configuration file://health-check-config.json \
              --instance-configuration file://instance-config.json \
              --tags Key=Environment,Value="$ENV_TAG" Key=Project,Value=hage-mvp Key=Type,Value=api Key=ManagedBy,Value=github-actions Key=Tier,Value=app-runner \
              --network-configuration file://network-config.json
          fi

          echo "Fetching service URL..."
          SERVICE_INFO=$(aws apprunner describe-service \
            --service-arn "$SERVICE_ARN" \
            --region ${{ env.AWS_REGION }} \
            --output json)

          SERVICE_URL=$(echo "$SERVICE_INFO" | jq -r '.Service.ServiceUrl')

          echo "Service URL: $SERVICE_URL"
          echo "Note: Deployment takes approximately 10 minutes to complete."
          echo "You can monitor the deployment progress in the AWS App Runner console:"
          echo "   https://console.aws.amazon.com/apprunner/home?region=${{ env.AWS_REGION }}#/services"

          # If this is a PR workflow, comment the URL on the PR
          if [ "${{ needs.determine-strategy.outputs.is_pr }}" = "true" ]; then
            echo "Commenting preview URL on PR #${{ github.event.number }}..."
            echo "SERVICE_NAME=$SERVICE_NAME" >> $GITHUB_ENV
            echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_ENV
            echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          else
              echo "Not a PR, skipping PR comment."
          fi
          
          # Clean up temporary files
          rm -f apprunner-config.json health-check-config.json instance-config.json network-config.json pr-comment.txt
          
          echo "Deployment initiated successfully"
          echo "Service ARN: $SERVICE_ARN"
          echo "URL: $SERVICE_URL"

      - name: Comment PR with preview link
        if: needs.determine-strategy.outputs.is_pr == 'true'
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const serviceName = process.env.SERVICE_NAME;
            const serviceUrl = process.env.SERVICE_URL;
            const imageTag = process.env.IMAGE_TAG;
            const prNumber = ${{ github.event.pull_request.number }};
            const commitSha = '${{ github.sha }}'.substring(0, 7);
            
            const comment = `## Preview Environment Ready!
            
            **Service:** \`${serviceName}\`
            **API Base URL:** \`https://${serviceUrl}/api\`
            **API Documentation:** [View API Docs](https://${serviceUrl}/api/docs)
            **Health Check:** [Check Health](https://${serviceUrl}/api/health)
            **AWS Console:** [View in AWS Console](https://console.aws.amazon.com/apprunner/home?region=${{ env.AWS_REGION }}#/services)
            
            ### Deployment Status
            - Deployment takes approximately 10 minutes to complete
            - Check the AWS App Runner console for real-time status
            - Monitor logs in the AWS console for any issues
            
            **Commit:** \`${commitSha}\`
            **Tag:** \`${imageTag}\`
            
            ---
            *This preview will be automatically cleaned up when the PR is closed.*`;
            
            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  deploy-to-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [determine-strategy, build-image]
    if: needs.determine-strategy.outputs.deploy_to_prod == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-service-role
          aws-region: ${{ env.AWS_REGION }}


      - name: Deploy to Production
        run: |
          ENVIRONMENT="prod"
          ENV_TAG="$ENVIRONMENT"
          
          # Set image tag based on different scenarios
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.image_tag }}" ]; then
            IMAGE_TAG="${{ github.event.inputs.image_tag }}"
          elif [ "${{ needs.determine-strategy.outputs.should_build }}" = "true" ]; then
            # Use the strategy image tag if available, otherwise use primary tag from build
            if [ -n "${{ needs.determine-strategy.outputs.image_tag }}" ]; then
              IMAGE_TAG="${{ needs.determine-strategy.outputs.image_tag }}"
            else
              IMAGE_TAG="${{ needs.build-image.outputs.primary_tag }}"
            fi
          else
            # Fallback to strategy image tag
            IMAGE_TAG="${{ needs.determine-strategy.outputs.image_tag }}"
          fi
          
          # Ensure we have a valid image tag
          if [ -z "$IMAGE_TAG" ]; then
            echo "Error: No image tag specified"
            exit 1
          fi
          
          IMAGE_URI="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/hage-mvp-app-${{ env.AWS_ACCOUNT_ID }}:$IMAGE_TAG"
          SERVICE_NAME="hage-mvp-app-prod"
          
          echo "Deploying to $ENVIRONMENT environment"
          echo "Service: $SERVICE_NAME"
          echo "Image: $IMAGE_URI"
          
          # Create JSON configuration file to avoid shell escaping issues
          ACCESS_ROLE_ARN="arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/hage-mvp-prod-app-runner-service-role"
          cat > apprunner-config.json << EOF
          {
            "ImageRepository": {
              "ImageIdentifier": "$IMAGE_URI",
              "ImageConfiguration": {
                "Port": "3000",
                "RuntimeEnvironmentVariables": {
                  "NODE_ENV": "$ENVIRONMENT",
                  "JWT_EXPIRES_IN": "15m",
                  "REFRESH_EXPIRES_DAYS": "30",
                  "MAIL_HOST": "${{ vars.MAIL_HOST_PROD }}",
                  "MAIL_PORT": "${{ vars.MAIL_PORT_PROD }}",
                  "MAIL_FROM": "${{ vars.MAIL_FROM_PROD }}",
                  "MAIL_USER": "${{ vars.MAIL_USER_PROD }}",
                  "MAIL_PASS": "${{ vars.MAIL_PASS_PROD }}",
                  "APP_NAME": "Hage Logistics",
                  "APP_URL": "${{ vars.APP_URL_PROD }}",
                  "FRONTEND_URL": "${{ vars.FRONTEND_URL_PROD }}",
                  "API_PREFIX": "/api",
                  "APP_LOGO": "https://res.cloudinary.com/doam8l8j9/image/upload/v1760557572/hage_logo_1_vkocjc.png",
                  "ENABLE_SEEDING": "${{ vars.ENABLE_PROD_SEEDING || 'false' }}"
                },
                "RuntimeEnvironmentSecrets": {
                  "DATABASE_URL": "arn:aws:secretsmanager:eu-west-2:283780611213:secret:hage-mvp/prod/rds/master-xRcVlo:DATABASE_URL::",
                  "JWT_SECRET": "arn:aws:secretsmanager:eu-west-2:283780611213:secret:hage-mvp/prod/jwt-secret-VfHP6e",
                  "CLOUDINARY_CLOUD_NAME": "arn:aws:secretsmanager:eu-west-2:283780611213:secret:hage-mvp/prod/cloudinary-credentials-rzQzW0:cloud_name::",
                  "CLOUDINARY_API_KEY": "arn:aws:secretsmanager:eu-west-2:283780611213:secret:hage-mvp/prod/cloudinary-credentials-rzQzW0:api_key::",
                  "CLOUDINARY_API_SECRET": "arn:aws:secretsmanager:eu-west-2:283780611213:secret:hage-mvp/prod/cloudinary-credentials-rzQzW0:api_secret::"
                }
              },
              "ImageRepositoryType": "ECR"
            },
            "AuthenticationConfiguration": {
              "AccessRoleArn": "$ACCESS_ROLE_ARN"
            },
            "AutoDeploymentsEnabled": false
          }
          EOF
          
          cat > health-check-config.json << EOF
          {
            "Protocol": "HTTP",
            "Path": "/api/health",
            "Interval": 10,
            "Timeout": 5,
            "HealthyThreshold": 2,
            "UnhealthyThreshold": 5
          }
          EOF
          
          cat > instance-config.json << EOF
          {
            "Cpu": "0.25 vCPU",
            "Memory": "0.5 GB",
            "InstanceRoleArn": "arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/hage-mvp-prod-app-runner-instance-role"
          }
          EOF

          cat > network-config.json << EOF
          {
