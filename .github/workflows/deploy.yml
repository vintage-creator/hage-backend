  cleanup-pr-service:
    name: Cleanup PR Service
    runs-on: ubuntu-latest
    needs: determine-strategy
    if: needs.determine-strategy.outputs.is_pr == 'true' && needs.determine-strategy.outputs.environment == 'cleanup'
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-service-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Delete PR service
        run: |
          PR_NUMBER=$(echo "${{ needs.determine-strategy.outputs.branch_name }}" | sed 's/pr-//')
          SERVICE_NAME="hage-mvp-app-pr-$PR_NUMBER"
          
          echo "Cleaning up service for PR #$PR_NUMBER"
          echo "Service name: $SERVICE_NAME"
          
          # Get the service ARN and status
          SERVICE_INFO=$(aws apprunner list-services \
            --region ${{ env.AWS_REGION }} \
            --query "ServiceSummaryList[?ServiceName=='$SERVICE_NAME'].{Arn:ServiceArn,Status:Status}" \
            --output json)
          
          if [ "$SERVICE_INFO" != "[]" ] && [ "$SERVICE_INFO" != "null" ]; then
            SERVICE_ARN=$(echo "$SERVICE_INFO" | jq -r '.[0].Arn')
            SERVICE_STATUS=$(echo "$SERVICE_INFO" | jq -r '.[0].Status')
            
            echo "Found service: $SERVICE_ARN"
            echo "Service status: $SERVICE_STATUS"
            
            # DeleteService fails with InvalidStateException while Status is OPERATION_IN_PROGRESS.
            wait_not_operation_in_progress() {
              local arn="$1"
              local max_attempts=60
              local n=1
              while [ "$n" -le "$max_attempts" ]; do
                local st
                st=$(aws apprunner describe-service \
                  --service-arn "$arn" \
                  --region ${{ env.AWS_REGION }} \
                  --query 'Service.Status' \
                  --output text 2>/dev/null || echo "NOT_FOUND")
                echo "  describe-service status: $st (attempt $n/$max_attempts)"
                if [ "$st" = "NOT_FOUND" ]; then
                  return 0
                fi
                if [ "$st" != "OPERATION_IN_PROGRESS" ]; then
                  return 0
                fi
                sleep 10
                n=$((n+1))
              done
              echo "ERROR: Timed out waiting for App Runner to leave OPERATION_IN_PROGRESS"
              return 1
            }
            
            delete_service_with_retries() {
              local arn="$1"
              local attempt=1
              local max_delete_attempts=6
              while [ "$attempt" -le "$max_delete_attempts" ]; do
                wait_not_operation_in_progress "$arn" || return 1
                local st
                st=$(aws apprunner describe-service \
                  --service-arn "$arn" \
                  --region ${{ env.AWS_REGION }} \
                  --query 'Service.Status' \
                  --output text 2>/dev/null || echo "NOT_FOUND")
                if [ "$st" = "NOT_FOUND" ]; then
                  echo "Service already deleted"
                  return 0
                fi
                if [ "$st" = "RUNNING" ]; then
                  echo "Pausing service before deletion (status: $st)..."
                  aws apprunner pause-service \
                    --service-arn "$arn" \
                    --region ${{ env.AWS_REGION }} || echo "pause-service failed, will retry delete"
                  wait_not_operation_in_progress "$arn" || return 1
                fi
                echo "delete-service attempt $attempt/$max_delete_attempts..."
                if aws apprunner delete-service \
                  --service-arn "$arn" \
                  --region ${{ env.AWS_REGION }} 2>delete_err.txt; then
                  rm -f delete_err.txt
                  return 0
                fi
                if grep -q InvalidStateException delete_err.txt 2>/dev/null; then
                  cat delete_err.txt
                  echo "Delete rejected (invalid state), retrying in 30s..."
                  rm -f delete_err.txt
                  sleep 30
                  attempt=$((attempt+1))
                  continue
                fi
                cat delete_err.txt
                rm -f delete_err.txt
                return 1
              done
              echo "ERROR: delete-service failed after $max_delete_attempts attempts"
              return 1
            }
            
            delete_service_with_retries "$SERVICE_ARN" || exit 1
            echo "Service deleted successfully"
            
            # Also clean up associated ECR images for this PR
            echo "Cleaning up ECR images for PR #$PR_NUMBER..."
            aws ecr list-images \
              --repository-name "hage-mvp-app-${{ env.AWS_ACCOUNT_ID }}" \
              --region ${{ env.AWS_REGION }} \
              --query "imageIds[?contains(imageTag, 'pr-$PR_NUMBER-')]" \
              --output json > pr_images.json || echo "No PR images found"
            
            if [ -s pr_images.json ] && [ "$(cat pr_images.json)" != "[]" ]; then
              echo "Found PR images to delete:"
              cat pr_images.json | jq -r '.[] | .imageTag'
              
              aws ecr batch-delete-image \
                --repository-name "hage-mvp-app-${{ env.AWS_ACCOUNT_ID }}" \
                --region ${{ env.AWS_REGION }} \
                --image-ids file://pr_images.json || echo "Failed to delete some images"
              
              echo "ECR images cleaned up"
            else
              echo "No PR-specific images found"
            fi
            
            rm -f pr_images.json
          else
            echo "Service $SERVICE_NAME not found - may have been already deleted"
          fi

  scheduled-cleanup:
    name: Scheduled Cleanup
    runs-on: ubuntu-latest
    needs: determine-strategy
    if: github.event_name == 'schedule'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-service-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Cleanup orphaned preview services
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Running scheduled cleanup of orphaned preview services..."

          # PR previews are deleted only when the PR is no longer open.
          # Prerelease previews still use a 7-day age threshold.
          OPEN_PR_LIST=$(mktemp)
          gh pr list --repo "${{ github.repository }}" --state open --limit 500 \
            --json number --jq '.[].number' | sort -n > "$OPEN_PR_LIST"
          echo "Open PRs on ${{ github.repository }}: $(wc -l < "$OPEN_PR_LIST" | tr -d ' ')"

          is_pr_open() {
            grep -qx "$1" "$OPEN_PR_LIST"
          }

          is_older_than_days() {
            local ts cutoff
            ts=$(date -d "$1" +%s)
            cutoff=$(date -d "${2} days ago" +%s)
            [ "$ts" -lt "$cutoff" ]
          }

          should_delete_preview_service() {
            local name="$1"
            local created_at="$2"
            if [[ "$name" =~ ^hage-mvp-app-pr-([0-9]+)$ ]]; then
              local pr_num="${BASH_REMATCH[1]}"
              if is_pr_open "$pr_num"; then
                echo "  Keeping $name: PR #$pr_num is still open"
                return 1
              fi
              echo "  Eligible for cleanup: PR #$pr_num is not open"
              return 0
            fi
            if [ "$name" = "hage-mvp-app-prerelease" ]; then
              if is_older_than_days "$created_at" 7; then
                echo "  Eligible for cleanup: prerelease service is older than 7 days"
                return 0
              fi
              echo "  Keeping $name: prerelease service is less than 7 days old"
              return 1
            fi
            echo "  Keeping $name: unrecognized preview service name"
            return 1
          }

          should_delete_preview_image() {
            local tag="$1"
            local pushed_at="$2"
            if [[ "$tag" =~ ^pr-([0-9]+)- ]]; then
              local pr_num="${BASH_REMATCH[1]}"
              if is_pr_open "$pr_num"; then
                echo "  Keeping image $tag: PR #$pr_num is still open"
                return 1
              fi
              echo "  Eligible for cleanup: PR #$pr_num image (PR not open)"
              return 0
            fi
            if [[ "$tag" =~ ^prerelease- ]]; then
              if is_older_than_days "$pushed_at" 7; then
                return 0
              fi
              echo "  Keeping image $tag: less than 7 days old"
              return 1
            fi
            return 1
          }

          # Get all preview services with more detailed info
          SERVICES=$(aws apprunner list-services \
            --region ${{ env.AWS_REGION }} \
            --query "ServiceSummaryList[?contains(ServiceName, \`hage-mvp-app-pr-\`) || contains(ServiceName, \`hage-mvp-app-prerelease\`)].{Name:ServiceName,Arn:ServiceArn,CreatedAt:CreatedAt,Status:Status}" \
            --output json)

          echo "Found preview services:"
          echo "$SERVICES" | jq -r '.[] | "  - \(.Name) (Status: \(.Status), Created: \(.CreatedAt))"'

          CLEANUP_COUNT=0
          ERROR_COUNT=0

          while IFS= read -r line; do
            service_arn=$(echo "$line" | cut -d"|" -f1)
            created_at=$(echo "$line" | cut -d"|" -f2)
            service_name=$(echo "$line" | cut -d"|" -f3)
            service_status=$(echo "$line" | cut -d"|" -f4)

            if ! should_delete_preview_service "$service_name" "$created_at"; then
              continue
            fi

            echo "Deleting orphaned service: $service_name (created: $created_at, status: $service_status)"

            if [ "$service_status" = "RUNNING" ]; then
              echo "  Pausing service before deletion..."
              aws apprunner pause-service --service-arn "$service_arn" --region ${{ env.AWS_REGION }} || echo "  Failed to pause service, continuing with deletion"
            fi

            n=1
            while [ "$n" -le 60 ]; do
              st=$(aws apprunner describe-service \
                --service-arn "$service_arn" \
                --region ${{ env.AWS_REGION }} \
                --query 'Service.Status' \
                --output text 2>/dev/null || echo "NOT_FOUND")
              echo "  pre-delete status: $st ($n/60)"
              if [ "$st" = "NOT_FOUND" ]; then
                break
              fi
              if [ "$st" != "OPERATION_IN_PROGRESS" ]; then
                break
              fi
              sleep 10
              n=$((n+1))
            done
            if [ "$n" -gt 60 ]; then
              echo "  ERROR: Timed out waiting for $service_name to leave OPERATION_IN_PROGRESS — skipping delete"
              ERROR_COUNT=$((ERROR_COUNT + 1))
              continue
            fi

            if aws apprunner delete-service --service-arn "$service_arn" --region ${{ env.AWS_REGION }}; then
              echo "  Successfully deleted $service_name"
              CLEANUP_COUNT=$((CLEANUP_COUNT + 1))
            else
              echo "  Failed to delete $service_name"
              ERROR_COUNT=$((ERROR_COUNT + 1))
            fi
          done < <(echo "$SERVICES" | jq -r ".[] | select(.CreatedAt != null) | select(.Name != null) | .Arn + \"|\" + .CreatedAt + \"|\" + .Name + \"|\" + .Status")

          echo "Cleanup Summary:"
          echo "  - Services deleted: $CLEANUP_COUNT"
          echo "  - Errors encountered: $ERROR_COUNT"

          # Clean up orphaned ECR images for closed PRs; prerelease images still use 7-day age.
          echo "Cleaning up orphaned ECR images..."
          ECR_CLEANUP_COUNT=0

          REPO_NAME="hage-mvp-app-${{ env.AWS_ACCOUNT_ID }}"
          IMAGE_DETAILS=$(aws ecr describe-images \
            --repository-name "$REPO_NAME" \
            --region ${{ env.AWS_REGION }} \
            --query 'imageDetails[?imagePushedAt!=null && imageTags!=null]' \
            --output json)

          while IFS= read -r line; do
            image_tag=$(echo "$line" | cut -d"|" -f1)
            pushed_at=$(echo "$line" | cut -d"|" -f2)

            if ! should_delete_preview_image "$image_tag" "$pushed_at"; then
              continue
            fi

            echo "Deleting orphaned image: $image_tag (pushed: $pushed_at)"
            if aws ecr batch-delete-image \
              --repository-name "$REPO_NAME" \
              --region ${{ env.AWS_REGION }} \
              --image-ids imageTag="$image_tag"; then
              echo "  Successfully deleted image: $image_tag"
              ECR_CLEANUP_COUNT=$((ECR_CLEANUP_COUNT + 1))
            else
              echo "  Failed to delete image: $image_tag"
            fi
          done < <(echo "$IMAGE_DETAILS" | jq -r '.[] | select((.imageTags[]? | startswith("pr-")) or (.imageTags[]? | startswith("prerelease-"))) | (.imageTags[]? | select(startswith("pr-") or startswith("prerelease-"))) + "|" + (.imagePushedAt|tostring)')

          rm -f "$OPEN_PR_LIST"

          echo "ECR Cleanup Summary:"
          echo "  - Images deleted: $ECR_CLEANUP_COUNT"
