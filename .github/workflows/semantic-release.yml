# Creates GitHub releases and version tags on push to main from conventional commits.
# Optional: posts release notes to Telegram (copy from there into WhatsApp).
#
# Telegram setup (free):
#   1. @BotFather → /newbot → copy token → secret TELEGRAM_BOT_TOKEN
#   2. Add the bot to your chat/group; send a message there
#   3. Open https://api.telegram.org/bot<TOKEN>/getUpdates → copy chat.id → secret TELEGRAM_CHAT_ID

name: Semantic Release

on:
  push:
    branches: [ main ]

concurrency:
  group: semantic-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post release notes to Telegram
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.semantic.outputs.new_release_git_tag }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram secrets not set (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID); skipping."
            exit 0
          fi
          NOTES=$(gh release view "$TAG" --repo "$REPO" --json body -q '.body // ""' 2>/dev/null || echo "")
          URL=$(gh release view "$TAG" --repo "$REPO" --json url -q '.url' 2>/dev/null \
            || echo "https://github.com/${REPO}/releases/tag/${TAG}")
          REPO_NAME="${REPO##*/}"
          MSG="🚀 ${REPO_NAME} ${TAG}

          ${NOTES}

          ${URL}"
          MSG="${MSG:0:4000}"
          PAYLOAD=$(jq -n \
            --arg chat_id "$TELEGRAM_CHAT_ID" \
            --arg text "$MSG" \
            '{chat_id: $chat_id, text: $text, disable_web_page_preview: false}')
          HTTP=$(curl -s -o /tmp/tg-response.json -w "%{http_code}" \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          if [ "$HTTP" != "200" ]; then
            echo "::warning::Telegram API HTTP $HTTP"
            cat /tmp/tg-response.json
            exit 0
          fi
          echo "Posted release notes to Telegram (copy to WhatsApp if needed)."
